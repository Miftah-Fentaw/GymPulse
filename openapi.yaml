  /v1/reports/{report}/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export a report
      description: |
        Phase: mvp. Change: reporting. Requires: owner, manager. format=csv or json. Offset pagination allowed for reports.
      x-gympulse-phase: mvp
      x-gympulse-change: reporting
      x-gympulse-requires: owner, manager
      parameters:
        - in: path
          name: report
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: format
          required: false
          schema:
            type: string
        - in: query
          name: branch_id
          required: false
          schema:
            type: string
        - in: query
          name: from
          required: false
          schema:
            type: string
        - in: query
          name: to
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List in-app notifications
      description: |
        Phase: later. Change: notifications. Requires: authenticated.
      x-gympulse-phase: later
      x-gympulse-change: notifications
      x-gympulse-requires: authenticated
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
  /v1/notifications/stream:
