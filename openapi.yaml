openapi: 3.1.0
info:
  title: GymPulse API
  version: 0.0.2
  description: |
    HTTP contract for the GymPulse Go server.
    Paths are the product catalog. Handlers are implemented per OpenSpec change.
    Each operation is marked Phase MVP or Later. oapi-codegen currently generates
    only getHealth, getReady, and postEcho until the owning change is applied.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: gym
  - name: members
  - name: memberships
  - name: leads
  - name: checkin
  - name: billing
  - name: classes
  - name: trainers
  - name: workouts
  - name: storage
  - name: reports
  - name: notifications
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: |
        Phase: mvp. Change: bootstrap-server. Requires: public. Returns 200 if the process is running. Does not ping the database.
      x-gympulse-phase: mvp
      x-gympulse-change: bootstrap-server
      x-gympulse-requires: public
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReady
      tags: [health]
      summary: Readiness probe
      description: |
        Phase: mvp. Change: bootstrap-server. Requires: public. Returns 200 when the database ping succeeds, otherwise 503.
      x-gympulse-phase: mvp
      x-gympulse-change: bootstrap-server
      x-gympulse-requires: public
      security: []
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        "503":
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /v1/echo:
    post:
      operationId: postEcho
      tags: [health]
      summary: Bootstrap validation probe
      description: |
        Phase: mvp. Change: bootstrap-server. Requires: public. Echoes a message. Used to exercise OpenAPI request validation.
      x-gympulse-phase: mvp
      x-gympulse-change: bootstrap-server
      x-gympulse-requires: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoRequest'
      responses:
        "200":
          description: Echoed message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoResponse'
        "400":
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Password login
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: public. Rate-limited. MUST NOT reveal whether the email exists.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
  /v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [auth]
      summary: Rotate refresh session
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: public. Primary: httpOnly cookie. JSON body token is fallback. CSRF Origin + X-GymPulse-Client.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
