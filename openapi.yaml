openapi: 3.1.0
info:
  title: GymPulse API
  version: 0.0.2
  description: |
    HTTP contract for the GymPulse Go server.
    Paths are the product catalog. Handlers are implemented per OpenSpec change.
    Each operation is marked Phase MVP or Later. oapi-codegen currently generates
    only getHealth, getReady, and postEcho until the owning change is applied.
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: staff
    description: Staff account management and role operations
  - name: audit
    description: Audit log events (owner and manager only)
  - name: gym
  - name: public
    description: Unauthenticated public endpoints (landing site, lead capture)
  - name: members
  - name: memberships
  - name: leads
  - name: checkin
  - name: billing
  - name: classes
  - name: trainers
  - name: workouts
  - name: storage
  - name: reports
  - name: notifications
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness probe
      description: |
        Phase: mvp. Change: bootstrap-server. Requires: public. Returns 200 if the process is running. Does not ping the database.
      x-gympulse-phase: mvp
      x-gympulse-change: bootstrap-server
      x-gympulse-requires: public
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReady
      tags: [health]
      summary: Readiness probe
      description: |
        Phase: mvp. Change: bootstrap-server. Requires: public. Returns 200 when the database ping succeeds, otherwise 503.
      x-gympulse-phase: mvp
      x-gympulse-change: bootstrap-server
      x-gympulse-requires: public
      security: []
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        "503":
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /v1/echo:
    post:
      operationId: postEcho
      tags: [health]
      summary: Bootstrap validation probe
      description: |
        Phase: mvp. Change: bootstrap-server. Requires: public. Echoes a message. Used to exercise OpenAPI request validation.
        Dev-only: this endpoint is unregistered when APP_ENV=production. Remove once a real validated endpoint exists.
      x-gympulse-phase: mvp
      x-gympulse-change: bootstrap-server
      x-gympulse-requires: public
      x-gympulse-dev-only: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoRequest'
      responses:
        "200":
          description: Echoed message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoResponse'
        "400":
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [auth]
      summary: Password login
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: public. Rate-limited. MUST NOT reveal whether the email exists.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful; access token returned, refresh cookie set
          headers:
            Set-Cookie:
              description: httpOnly Secure refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
  /v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [auth]
      summary: Rotate refresh session
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: public. Primary: httpOnly cookie. JSON body token is fallback. CSRF Origin + X-GymPulse-Client.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: public
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/XGymPulseClient'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: New access token issued; refresh cookie rotated
          headers:
            Set-Cookie:
              description: Rotated httpOnly Secure refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/Error'
  /v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: Revoke current refresh session
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      parameters:
        - $ref: '#/components/parameters/XGymPulseClient'
      responses:
        "204":
          description: Session revoked; refresh cookie cleared
          headers:
            Set-Cookie:
              description: Cleared refresh cookie
              schema:
                type: string
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
  /v1/auth/bootstrap-owner:
    post:
      operationId: postAuthBootstrapOwner
      tags: [auth]
      summary: Create first owner
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: public. Rejected once an owner exists. Requires BOOTSTRAP_TOKEN env var.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapOwnerRequest'
      responses:
        "201":
          description: First owner created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/auth/password/change:
    post:
      operationId: postAuthPasswordChange
      tags: [auth]
      summary: Change own password
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        "204":
          description: Password changed; current session retained
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
  /v1/auth/password/forgot:
    post:
      operationId: postAuthPasswordForgot
      tags: [auth]
      summary: Request password reset
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: public. Always returns 202. Enqueues a reset token via the notification outbox.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        "202":
          description: Request accepted; reset email enqueued if email exists
        "400":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      tags: [auth]
      summary: Reset password with token
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: public.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        "204":
          description: Password reset; all refresh sessions revoked
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/invite:
    post:
      operationId: postAuthInvite
      tags: [auth]
      summary: Invite staff
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInviteRequest'
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/auth/invite/accept:
    post:
      operationId: postAuthInviteAccept
      tags: [auth]
      summary: Accept staff invite
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: public.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAcceptRequest'
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteAcceptResponse'
        "400":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/verify-email:
    post:
      operationId: postAuthVerifyEmail
      tags: [auth]
      summary: Request email verification
      description: |
        Phase: later. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: later
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/auth/verify-phone:
    post:
      operationId: postAuthVerifyPhone
      tags: [auth]
      summary: Request phone verification
      description: |
        Phase: later. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: later
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/auth/verify/confirm:
    post:
      operationId: postAuthVerifyConfirm
      tags: [auth]
      summary: Confirm email or phone token
      description: |
        Phase: later. Change: auth-and-roles. Requires: public.
      x-gympulse-phase: later
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyConfirmRequest'
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user profile
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchMe
      tags: [auth]
      summary: Update current user profile
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MePatchRequest'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/me/sessions:
    get:
      operationId: listMySessions
      tags: [auth]
      summary: List own refresh sessions
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
  /v1/me/sessions/{sessionId}:
    delete:
      operationId: revokeMySession
      tags: [auth]
      summary: Revoke one of own sessions
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
  /v1/staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff accounts
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager, receptionist.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager, receptionist
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
  /v1/staff/{staffId}:
    get:
      operationId: getStaff
      tags: [staff]
      summary: Get staff account
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager, receptionist.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager, receptionist
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchStaff
      tags: [staff]
      summary: Update staff account
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffPatchRequest'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/staff/{staffId}/roles:
    put:
      operationId: putStaffRoles
      tags: [staff]
      summary: Replace staff roles
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager. Owner role changes require owner; manager can only set receptionist/trainer.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRolesRequest'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/staff/{staffId}/deactivate:
    post:
      operationId: postStaffDeactivate
      tags: [staff]
      summary: Deactivate staff
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager. Last active owner cannot be deactivated (409 last_owner).
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Staff account deactivated; returns updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/staff/{staffId}/reactivate:
    post:
      operationId: postStaffReactivate
      tags: [staff]
      summary: Reactivate staff
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Staff account reactivated; returns updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
        "409":
          $ref: '#/components/responses/Error'
  /v1/staff/{staffId}/revoke-sessions:
    post:
      operationId: postStaffRevokeSessions
      tags: [staff]
      summary: Revoke all sessions for a user
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager
      parameters:
        - in: path
          name: staffId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: All sessions revoked
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
        "404":
          $ref: '#/components/responses/Error'
  /v1/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: List audit events
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: owner, manager.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: owner, manager
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: actor_user_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: action
          required: false
          schema:
            type: string
        - in: query
          name: from
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPage'
        "400":
          $ref: '#/components/responses/Error'
        "401":
          $ref: '#/components/responses/Error'
        "403":
          $ref: '#/components/responses/Error'
  /v1/gym:
    get:
      operationId: getGym
      tags: [gym]
      summary: Get gym settings
      description: |
        Phase: mvp. Change: auth-and-roles. Requires: authenticated.
      x-gympulse-phase: mvp
      x-gympulse-change: auth-and-roles
      x-gympulse-requires: authenticated
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
        "400":
