components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: httpOnly Secure refresh token cookie set on the API host

  parameters:
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: Opaque pagination cursor from a previous page's next_cursor

    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum items to return per page

    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: >
        Client-generated idempotency key (8-128 chars). Same key + same body replays
        the original response with Idempotent-Replayed: true. Same key + different body
        returns 422 with error.code idempotency_conflict. Keys expire after 24h.

    BranchId:
      in: query
      name: branch_id
      required: false
      schema:
        type: string
        format: uuid
      description: Filter by branch UUID

    From:
      in: query
      name: from
      required: false
      schema:
        type: string
        format: date
      description: Start date (inclusive), ISO 8601 date

    To:
      in: query
      name: to
      required: false
      schema:
        type: string
        format: date
      description: End date (inclusive), ISO 8601 date

    XGymPulseClient:
      in: header
      name: X-GymPulse-Client
      required: false
      schema:
        type: string
      description: CSRF guard for cookie-authenticated auth routes (admin or app)

  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Forbidden:
      description: Authenticated but insufficient capabilities
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    NotFound:
      description: Resource not found or not visible to this principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Conflict:
      description: State conflict (duplicate, last_owner, etc.)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Present on 429 responses
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    UnprocessableEntity:
      description: Idempotency conflict or semantic validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # ─── Bootstrap schemas (keep for codegen compat) ────────────────────────
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadyResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready]

    EchoRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string

    EchoResponse:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string

    # ─── Error envelope ──────────────────────────────────────────────────────
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                fields:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [field, code, message]
                    properties:
                      field:
                        type: string
                      code:
                        type: string
                      message:
                        type: string

    # ─── Pagination ──────────────────────────────────────────────────────────
    CursorPageBase:
      type: object
      additionalProperties: false
      required: [next_cursor]
      properties:
        next_cursor:
          type:
            - string
            - "null"

    # Generic untyped page — used by list endpoints until Stage 2 types them
    CursorPage:
      allOf:
        - $ref: '#/components/schemas/CursorPageBase'
        - type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/JsonObject'

    # Temporary untyped object — will be eliminated in Stage 2
    JsonObject:
      type: object
      additionalProperties: true

    # ─── Enums ───────────────────────────────────────────────────────────────
    Role:
      type: string
      enum: [owner, manager, receptionist, trainer]

    MembershipStatus:
      type: string
      enum: [pending, active, frozen, expired, cancelled]

    MemberStatus:
      type: string
      enum: [active, archived]

    InvoiceStatus:
      type: string
      enum: [draft, issued, partially_paid, paid, void]

    PaymentMethod:
      type: string
      enum: [cash, bank_transfer, mobile_money]

    PaymentStatus:
      type: string
      enum: [completed, partially_refunded, refunded]

    DurationUnit:
      type: string
      enum: [day, week, month, year]

    LeadStatus:
      type: string
      enum: [new, contacted, trial_booked, converted, lost]

    LeadSource:
      type: string
      enum: [landing, walk_in, referral, social, other]

    CheckinMethod:
      type: string
      enum: [qr, code_fallback, staff]

    CheckinStatus:
      type: string
      enum: [valid, voided]

    SessionStatus:
      type: string
      enum: [scheduled, cancelled, completed]

    BookingStatus:
      type: string
      enum: [booked, attended, no_show, cancelled, late_cancelled]

    PtSessionStatus:
      type: string
      enum: [booked, completed, cancelled, no_show]

    GoalType:
      type: string
      enum: [weight, body_fat, strength, attendance, custom]

    GoalStatus:
      type: string
      enum: [active, achieved, dropped]

    FileVisibility:
      type: string
      enum: [private, public_asset]

    FileMetadata:
      type: object
      additionalProperties: false
      required: [id, gym_id, filename, visibility, uploader_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        filename:
          type: string
        visibility:
          $ref: '#/components/schemas/FileVisibility'
        uploader_id:
          type: string
          format: uuid
        size:
          type: integer
          description: bytes
        content_type:
          type: string
        created_at:
          type: string
          format: date-time

    SignedUrl:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        method:
          type: string
          description: HTTP method to use (GET/PUT)
        headers:
          type: object
          additionalProperties:
            type: string

    InvoiceLineKind:
      type: string
      enum: [membership, signup_fee, pt_session, product, other]

    StaffAccountStatus:
      type: string
      enum: [active, invited, deactivated]

    # ─── Auth request schemas ────────────────────────────────────────────────
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          description: Fallback when httpOnly cookie is unavailable

    BootstrapOwnerRequest:
      type: object
      additionalProperties: false
      required: [setup_token, email, password, gym_name]
      properties:
        setup_token:
          type: string
          description: Value of BOOTSTRAP_TOKEN env var
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        gym_name:
          type: string

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10

    PasswordForgotRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 10

    StaffInviteRequest:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        branch_ids:
          type: array
          items:
            type: string
            format: uuid

    InviteAcceptRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
        name:
          type: string

    VerifyConfirmRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string

    MePatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        phone:
          type: string

    # ─── Auth response schemas (Stage 2 additions for auth-and-roles) ─────────────────
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, gym_id, staff_roles, has_member_profile]
      properties:
        id:
          type: string
          format: uuid
        gym_id:
          type: string
          format: uuid
        staff_roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        has_member_profile:
          type: boolean
        name:
          type: string
        email:
          type: string
          format: email

    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, user]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: seconds until access token expiry
        user:
          $ref: '#/components/schemas/UserSummary'

    RefreshResponse:
      allOf:
        - $ref: '#/components/schemas/LoginResponse'

    MeResponse:
      $ref: '#/components/schemas/UserSummary'

    Session:
      type: object
      additionalProperties: false
      required: [id, created_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
        device:
          type: string
        ip:
          type: string
        revoked:
          type: boolean

    SessionsResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'

    InviteResponse:
      type: object
      additionalProperties: false
      properties:
        invite_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    InviteAcceptResponse:
      type: object
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid

    # ───────────────────────────────────────────────────────────────────────────

    StaffPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        phone:
          type: string

    StaffRolesRequest:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        branch_ids:
          type: array
          items:
            type: string
            format: uuid

    # ─── Gym / branch request schemas ────────────────────────────────────────
    GymPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: string

    BrandingPatchRequest:
      type: object
      additionalProperties: false
      properties:
        logo_file_id:
          type: string
          format: uuid
        primary_color:
          type: string
        public_tagline:
          type: string

    BranchCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string

    BranchPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string

    HoursRequest:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [weekday, closed]
            properties:
              weekday:
                type: integer
                minimum: 1
                maximum: 7
              closed:
                type: boolean
              intervals:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [opens_at, closes_at]
                  properties:
                    opens_at:
                      type: string
                      pattern: '^\d{2}:\d{2}$'
                    closes_at:
                      type: string
                      pattern: '^\d{2}:\d{2}$'

    HolidayCreateRequest:
      type: object
      additionalProperties: false
      required: [date, name]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
        branch_id:
          type: string
          format: uuid

    # ─── Member request schemas ──────────────────────────────────────────────
    MemberCreateRequest:
      type: object
      additionalProperties: false
      required: [name, home_branch_id]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        home_branch_id:
          type: string
          format: uuid
        date_of_birth:
          type: string
          format: date
        photo_file_id:
          type: string
          format: uuid
        existing_user_id:
          type: string
          format: uuid
        emergency_contact_name:
          type: string
        emergency_contact_phone:
          type: string
        member_code:
          type: string

    MemberPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        phone:
          type: string
        home_branch_id:
          type: string
          format: uuid
        date_of_birth:
          type: string
          format: date
        photo_file_id:
          type: string
          format: uuid
        emergency_contact_name:
          type: string
        emergency_contact_phone:
          type: string

    NoteCreateRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string

    # ─── Plan / membership request schemas ───────────────────────────────────
    PlanCreateRequest:
      type: object
      additionalProperties: false
      required: [name, price_minor, duration_unit, duration_count]
      properties:
        name:
          type: string
        description:
          type: string
        price_minor:
          type: integer
          format: int64
          minimum: 0
        duration_unit:
          $ref: '#/components/schemas/DurationUnit'
        duration_count:
          type: integer
          minimum: 1
        visits_included:
          type:
            - integer
            - "null"
          description: null means unlimited
        signup_fee_minor:
          type: integer
          format: int64
          minimum: 0
          default: 0
        freeze_allowed:
          type: boolean
          default: false
        max_freeze_days:
          type: integer
          minimum: 0
          default: 0
        branch_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Empty array means all branches
        is_active:
          type: boolean
          default: true
        sort_order:
          type: integer
          default: 0

    PlanPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        price_minor:
          type: integer
          format: int64
          minimum: 0
        duration_unit:
          $ref: '#/components/schemas/DurationUnit'
        duration_count:
          type: integer
          minimum: 1
        visits_included:
          type:
            - integer
            - "null"
        signup_fee_minor:
          type: integer
          format: int64
          minimum: 0
        freeze_allowed:
          type: boolean
        max_freeze_days:
          type: integer
          minimum: 0
        branch_ids:
          type: array
          items:
            type: string
            format: uuid
        is_active:
          type: boolean
        sort_order:
          type: integer

    MembershipAssignRequest:
      type: object
      additionalProperties: false
      required: [plan_id, start_date]
      properties:
        plan_id:
          type: string
          format: uuid
        start_date:
          type: string
          format: date
        auto_renew:
          type: boolean
          default: false
        create_invoice:
          type: boolean
          default: true
        initial_payment:
          $ref: '#/components/schemas/PaymentCreateRequest'

    MembershipFreezeRequest:
      type: object
      additionalProperties: false
      required: [start_date, end_date]
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        reason:
          type: string

    MembershipUpgradeRequest:
      type: object
      additionalProperties: false
      required: [plan_id]
      properties:
        plan_id:
          type: string
          format: uuid
        effective_date:
          type: string
          format: date

    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string

    # ─── Lead request schemas ────────────────────────────────────────────────
    LeadCreateRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [name, phone]
        - required: [name, email]
      properties:
        name:
          type: string
          maxLength: 200
        phone:
          type: string
        email:
          type: string
          format: email
        message:
          type: string
          maxLength: 2000
        source:
          $ref: '#/components/schemas/LeadSource'
        preferred_branch_id:
          type: string
          format: uuid
        marketing_consent:
          type: boolean
          default: false
        honeypot:
          type: string
          description: Must be empty; non-empty submissions are silently discarded
        captcha_token:
          type: string

    LeadPatchRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/LeadStatus'
        assigned_to_user_id:
          type: string
          format: uuid

    LeadConvertRequest:
      type: object
      additionalProperties: false
      required: [home_branch_id]
      properties:
        home_branch_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string

    # ─── Check-in request schemas ────────────────────────────────────────────
    CheckinRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [token, branch_id]
          properties:
            token:
              type: string
            branch_id:
              type: string
              format: uuid
        - required: [member_code, branch_id, method, photo_confirmed]
          properties:
            member_code:
              type: string
            branch_id:
              type: string
              format: uuid
            method:
              type: string
              enum: [code_fallback]
            photo_confirmed:
              type: boolean
              enum: [true]

    StaffCheckinRequest:
      type: object
      additionalProperties: false
      required: [member_id, branch_id]
      properties:
        member_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid

    CheckinCorrectionRequest:
      type: object
      additionalProperties: false
      properties:
        void:
          type: boolean
        branch_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        reason:
          type: string

    # ─── Billing request schemas ─────────────────────────────────────────────
    DiscountRequest:
      type: object
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        percent:
          type: integer
          minimum: 1
          maximum: 100
        reason:
          type: string

    PaymentCreateRequest:
      type: object
      additionalProperties: false
      required: [amount_minor, method]
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        method:
          $ref: '#/components/schemas/PaymentMethod'
        provider:
          type: string
          description: Free text, e.g. mobile money operator or bank name
        reference:
          type: string
        paid_at:
          type: string
          format: date-time
        note:
          type: string

    RefundRequest:
      type: object
      additionalProperties: false
      required: [amount_minor, reason]
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string

    PromoCodeCreateRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
        description:
          type: string
        discount_percent:
          type: integer
          minimum: 1
          maximum: 100
        discount_minor:
          type: integer
          format: int64
          minimum: 1
        max_uses:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time

    # ─── Classes / booking request schemas ───────────────────────────────────
    ClassTypeCreateRequest:
      type: object
      additionalProperties: false
      required: [name, default_capacity]
      properties:
        name:
          type: string
        description:
          type: string
        default_capacity:
          type: integer
          minimum: 1
        default_duration_min:
          type: integer
          minimum: 1
        color:
          type: string

    ClassTypePatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        default_capacity:
          type: integer
          minimum: 1
        default_duration_min:
          type: integer
          minimum: 1
        color:
          type: string
        is_active:
          type: boolean

    ClassScheduleCreateRequest:
      type: object
      additionalProperties: false
      required: [class_type_id, branch_id, weekdays, start_time, duration_min, capacity, effective_from]
      properties:
        class_type_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        trainer_id:
          type: string
          format: uuid
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        start_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
        duration_min:
          type: integer
          minimum: 1
        capacity:
          type: integer
          minimum: 1
        effective_from:
          type: string
          format: date
        effective_until:
          type: string
          format: date

    ClassSchedulePatchRequest:
      type: object
      additionalProperties: false
      properties:
        trainer_id:
          type: string
          format: uuid
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        start_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
        duration_min:
          type: integer
          minimum: 1
        capacity:
          type: integer
          minimum: 1
        effective_until:
          type: string
          format: date
        is_active:
          type: boolean

    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [name, branch_id, starts_at, ends_at, capacity]
      properties:
        name:
          type: string
        class_type_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        trainer_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1

    SessionPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        trainer_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1

    SessionCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
        notify_members:
          type: boolean
          default: true

    ScheduleGenerateRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    BookingCreateRequest:
      type: object
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid

    ClassAttendanceRequest:
