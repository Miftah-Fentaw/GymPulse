name: CI - Backend

on:
  push:
    paths:
      - 'apps/backend/**'
      - 'services/go-shared/**'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'services/go-shared/**'

jobs:
  go-backend:
    name: Go Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            apps/backend/go.sum
            services/go-shared/go.sum

      - name: Tidy shared library
        working-directory: services/go-shared
        run: go mod tidy

      - name: Tidy backend
        working-directory: apps/backend
        run: go mod tidy

      - name: Build
        working-directory: apps/backend
        run: go build ./...

      - name: Vet
        working-directory: apps/backend
        run: go vet ./...

      - name: Test
        working-directory: apps/backend
        run: go test ./...
