version: "3.9"

services:
  # ─── Go Backend (single unified API) ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - BACKEND_PORT=8080
    networks:
      - gym-pulse-network
    restart: unless-stopped

  # ─── Notification Service (SMTP + Firebase push) ──────────────────────────────
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3003
    networks:
      - gym-pulse-network
    restart: unless-stopped

  # ─── AI Service (Python / FastAPI) ───────────────────────────────────────────
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/ai-service/models:/app/models
    networks:
      - gym-pulse-network
    restart: unless-stopped

  # ─── Web Apps ─────────────────────────────────────────────────────────────────
  web-system-admin:
    build:
      context: ./apps/web-system-admin
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - gym-pulse-network

  web-user-admin:
    build:
      context: ./apps/web-user-admin
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - gym-pulse-network

  web-shop:
    build:
      context: ./apps/web-shop
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - gym-pulse-network

  web-landing:
    build:
      context: ./apps/web-landing
      dockerfile: Dockerfile
    ports:
      - "3004:3000"
    env_file: .env
    networks:
      - gym-pulse-network

networks:
  gym-pulse-network:
    driver: bridge
